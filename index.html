<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JadanPay Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b3a;--mut:#6d6a8c;--bg:#f4f5fb;--card:#fff;--line:#e6e7f2;--acc:#6d5efc;--ok:#14915a;--bad:#e11d48;--warn:#b45309}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--mut)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px #1b1b3a14}
.brand-l{font-weight:800;font-size:22px;margin-bottom:6px}
.brand-l span,.brand span{color:#14915a}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{font-weight:800;font-size:18px;padding:6px 10px 16px}
.nav{background:none;border:0;color:#cfd0ea;text-align:left;padding:10px 12px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer}
.nav:hover{background:#ffffff14}
.nav.on{background:var(--acc);color:#fff}
.main{padding:20px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.k2{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.k4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap}.k2{grid-template-columns:1fr}.main{padding:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:800;margin-top:6px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:hover{filter:brightness(.97)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:12px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg{width:48px;height:28px;border-radius:99px;border:0;background:#d6d8e8;position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--ok)}
.tg.on::after{transform:translateX(20px)}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:#dcfce7;color:#14532d}
.t-bad{background:#ffe4e6;color:#9f1239}
.t-warn{background:#fef3c7;color:#78350f}
.t-info{background:#e0e7ff;color:#312e81}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer}
tr.click:hover{background:#f7f7fd}
.scroll{overflow-x:auto}
.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;margin-bottom:24px}
.bars div{flex:1;background:linear-gradient(var(--acc),#a5b4fc);border-radius:8px 8px 2px 2px;min-height:4px;position:relative}
.bars span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #c7c2ff;border-color:var(--acc)}
.fld{display:grid;gap:6px;margin:10px 0}
.fld span{font-size:12px;color:var(--mut);font-weight:600}
.drawer{position:fixed;inset:0;background:#1b1b3a55;display:none;justify-content:flex-end;z-index:50}
.drawer.on{display:flex}
.dr-in{width:min(480px,100%);background:#fff;height:100%;overflow:auto;padding:22px;position:relative}
.modal{position:fixed;inset:0;background:#1b1b3a66;display:none;place-items:center;z-index:60;padding:20px}
.modal.on{display:grid}
.mo-in{background:#fff;border-radius:16px;padding:22px;width:min(420px,100%)}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;transition:transform .3s;z-index:70;max-width:92vw}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.it{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.it.on{border-color:var(--acc);background:#f5f3ff}
.thread .m{max-width:82%;padding:9px 12px;border-radius:12px;margin:8px 0;background:#f1f2f9}
.thread .m.agent{margin-left:auto;background:#e0e7ff}
.prov{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.danger-zone{border:1px dashed #fecdd3;border-radius:12px;padding:12px}
.logo-box{width:64px;height:64px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:12px}
.logo-box img{width:100%;height:100%;object-fit:cover}
.brand-prev{border-radius:16px;padding:20px}
.bp-btn{padding:8px 14px;border-radius:10px;font-weight:700;color:#1b1b3a;border:2px solid #1b1b3a}
.secret-note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;color:#7c2d12}
.notice{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:12px;color:#312e81}
.catname{font-weight:600}
/* collapsible sidebar */
.shell{transition:grid-template-columns .25s}
.shell.collapsed{grid-template-columns:78px 1fr}
.shell.collapsed .side{padding:18px 8px;align-items:stretch}
.shell.collapsed .side .brand{font-size:12px;padding:6px 0 14px;text-align:center}
.shell.collapsed .lbl,.shell.collapsed .grp{display:none}
.shell.collapsed .nav{justify-content:center;padding:10px 0}
.side .nav{display:flex;align-items:center;gap:10px;white-space:nowrap}
.nav .ic{width:22px;text-align:center;flex:none}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8d8fbf;margin:14px 12px 4px}
/* permissions and staff */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px}
.pm{display:flex;gap:8px;align-items:center;font-size:13px}
.pm input{width:auto}
@media(max-width:700px){.perm-grid{grid-template-columns:1fr}}
.avatar-big{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.tmp{font:700 22px ui-monospace,monospace;background:#f1f2f9;border-radius:12px;padding:14px;text-align:center;letter-spacing:.04em;margin:12px 0}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <div class="brand-l">JADAN<span>PAY</span> Admin</div>
    <p class="muted">Sign in to manage customers, transactions, services and support.</p>
    <label class="fld"><span>Email</span><input id="lgEmail" type="email" value="admin@jadanpay.app"></label>
    <label class="fld"><span>Password</span><input id="lgPass" type="password" placeholder="Enter password"></label>
    <p id="lgErr" style="color:var(--bad);min-height:20px;margin:6px 0"></p>
    <button class="btn" style="width:100%" data-act="login">Sign in</button>
    <p class="muted" style="font-size:12px;margin-top:14px">Demo admin: admin@jadanpay.app · admin123. Change this password before going live.</p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="brand">JADAN<span>PAY</span></div>
    <div id="nav" style="display:flex;flex-direction:column;gap:4px"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="row"><button class="btn ghost" data-act="navToggle" title="Show or hide the menu" aria-label="Toggle menu">☰</button><h1 id="vTitle"></h1><span id="maintBadge" class="tag t-ok">Live</span><span class="muted" id="whoami"></span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="drawer" id="drawer"><div class="dr-in"><button class="btn ghost" style="position:absolute;right:16px;top:16px" data-act="closeDrawer">✕ Close</button><div id="drawerBody" style="margin-top:44px"></div></div></div>
<div class="modal" id="modal"><div class="mo-in" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   JadanPay Admin dashboard
   Data is kept in this browser (localStorage) until a backend
   is connected in Settings. Every change is written to the audit log.
   ============================================================ */

const TODAY = new Date('2026-11-12T12:00:00Z');
const KEY = 'jp_admin_v1';
const VIEWS = [
  ['overview','Overview','📊'], ['users','Customers','👥'], ['txs','Transactions','🧾'],
  ['services','Services & pricing','🛒'], ['network','Network health','📡'], ['support','Support inbox','💬'],
  ['announce','Announcements','📢'], ['referrals','Referrals','🎁'], ['reports','Reports','📑'],
  ['audit','Audit log','🕘'], ['catalog','Plans & bills','📦'], ['integrations','Integrations','🔌'], ['brand','Brand','🎨'], ['settings','Settings','⚙️'], ['staff','Staff','👤'], ['roles','Roles & permissions','🛡️'], ['profile','My profile','🙍']
];
let VIEW = 'overview', AUTH = false, CUR = null;
let NAV_COLLAPSED = (() => { try { return localStorage.getItem('jp_admin_nav') === '1'; } catch(e) { return false; } })();
const UI = {uq:'', uf:'all', tq:'', tt:'all', ts:'all', ticket:null};

const $ = s => document.querySelector(s);
function rnd(a,b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a){ return a[rnd(0, a.length - 1)]; }
function ago(h){ return new Date(TODAY.getTime() - h * 3600e3).toISOString(); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ngn(n){ return '₦' + Number(n || 0).toLocaleString('en-NG'); }
function when(iso){ const d = new Date(iso); return d.toLocaleDateString('en-NG',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'}); }
function dayKey(d){ return new Date(d).toISOString().slice(0,10); }
function refCodeOf(u){ return 'JP-' + u.name.split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'').slice(0,6); }
function label(k){ return {air:'Airtime', data:'Data', bill:'Bills', send:'Transfers', fund:'Funding'}[k] || k; }
function badge(s){
  const map = {success:['t-ok','Successful'], failed:['t-bad','Failed'], refunded:['t-info','Refunded'], open:['t-warn','Open'], resolved:['t-ok','Resolved']};
  const [c,t] = map[s] || ['t-info', s];
  return `<span class="tag ${c}">${t}</span>`;
}

/* ---------- Sample data ---------- */
function seed(){
  const names = ['Ada Okafor','Chinedu Obi','Amaka Eze','Tunde Bello','Ngozi Ibe','Musa Lawal','Funke Adeyemi','Emeka Nwosu','Halima Sani','Kemi Oladipo','Ifeanyi Ude','Zainab Yusuf'];
  const pre = ['0803','0805','0802','0809','0703','0813'];
  const users = names.map((n,i) => ({
    id:'U'+(1001+i), name:n,
    email: i===0 ? 'demo@kwiktop.app' : n.split(' ')[0].toLowerCase()+i+'@mail.com',
    phone: i===0 ? '08012345678' : pre[i%6] + String(rnd(1000000,9999999)),
    tier: i%4===0 ? 'Reseller' : 'Basic',
    wallet: i===0 ? 12450 : rnd(500,25000),
    earn: rnd(0,3000), refs: rnd(0,6),
    status: i===7 ? 'suspended' : 'active',
    pinSet: i!==3, kyc: i%3===0 ? 'verified' : 'none',
    joined: ago(rnd(3,120)*24), alerts: []
  }));
  const txs = Array.from({length:60}, (_,i) => {
    const type = pick(['air','data','bill','send','fund']), u = pick(users);
    const amt = pick({air:[100,200,500,1000,2000], data:[200,500,1000,3000], bill:[2000,5000,10000,19000], send:[500,1000,2000,5000], fund:[1000,5000,10000]}[type]);
    const pr = {air:Math.round(amt*.03), data:Math.round(amt*.1), bill:Math.round(amt*.02), send:0, fund:0}[type];
    return {ref:'JP'+(500000+i*131).toString(36).toUpperCase(), type, userId:u.id, user:u.name, phone:u.phone,
            network:pick(['MTN','Airtel','Glo','9mobile']), amt, pr, status: Math.random()<.93 ? 'success' : 'failed', at: ago(rnd(0,24*7))};
  }).sort((x,y) => y.at.localeCompare(x.at));
  return {
    admin:{email:'admin@jadanpay.app', pass:'admin123'},
    users, txs,
    plans:[
      {sz:'500MB',v:'7 days',price:200,cost:176,active:true},
      {sz:'1.5GB',v:'30 days',price:500,cost:462,active:true},
      {sz:'3GB',v:'30 days',price:1000,cost:935,active:true},
      {sz:'10GB',v:'30 days',price:3000,cost:2860,active:true}
    ],
    providers:[
      {svc:'Cable TV',name:'DSTV',active:true},{svc:'Cable TV',name:'GOTV',active:true},{svc:'Cable TV',name:'Startimes',active:true},
      {svc:'Electricity',name:'Ikeja Electric',active:true},{svc:'Electricity',name:'Eko DisCo',active:true},{svc:'Electricity',name:'Abuja DisCo',active:true},
      {svc:'Internet',name:'Spectranet',active:true},{svc:'Internet',name:'Smile',active:true},
      {svc:'More',name:'WAEC PIN',active:true},{svc:'More',name:'NECO PIN',active:true},{svc:'More',name:'Bet9ja',active:true},{svc:'More',name:'SportyBet',active:true}
    ],
    networks:[
      {name:'MTN',rate:97.8,lat:4.1,status:'operational'},{name:'Airtel',rate:94.2,lat:5.3,status:'operational'},
      {name:'Glo',rate:91.6,lat:6.0,status:'degraded'},{name:'9mobile',rate:88.9,lat:7.4,status:'degraded'}
    ],
    tickets:[
      {id:'T-201',user:'Ada Okafor',subject:'Failed payment',status:'open',msgs:[{from:'user',text:'My airtime was debited but did not arrive.',at:ago(3)},{from:'agent',text:'Sorry about that. Checking now.',at:ago(2)}]},
      {id:'T-202',user:'Chinedu Obi',subject:'Forgot transaction PIN',status:'open',msgs:[{from:'user',text:'I forgot my transaction PIN. Please help.',at:ago(5)}]},
      {id:'T-203',user:'Amaka Eze',subject:'Verify wallet',status:'resolved',msgs:[{from:'user',text:'BVN was accepted but no account number appeared.',at:ago(30)},{from:'agent',text:'Fixed. Your account number is now active.',at:ago(28)}]}
    ],
    announcements:[{id:'A1',title:'Welcome to JadanPay',body:'Invite friends and earn ₦100 for each one who joins.',audience:'All customers',status:'published',at:ago(48)}],
    brand:defaultBrand(), integrations:defaultIntegrations(), catalog:defaultCatalog(),
    roles:defaultRoles(), staff:[ownerFrom(null)],
    settings:{maintenance:false, showDemo:true, airMargin:3, resellerMargin:5, welcomeBonus:1000, referralBonus:100, pinMaxTries:3, pinLockMins:10, banner:'', bannerOn:false, apiBase:''},
    audit:[]
  };
}
function load(){
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); d.brand = d.brand || defaultBrand(); d.integrations = d.integrations || defaultIntegrations(); d.catalog = (d.catalog || defaultCatalog()).map(normItem);
    d.roles = d.roles || defaultRoles(); d.staff = d.staff || [ownerFrom(d)]; return d; }
  } catch(e){}
  return seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }
let DB = load();
function log(action, detail){
  DB.audit.unshift({at:new Date().toISOString(), by:(self() ? self().email : 'system'), action, detail});
  DB.audit = DB.audit.slice(0, 300);
  save();
}
const U = id => DB.users.find(u => u.id === id);
function defaultBrand(){
  return {appName:'JadanPay', tagline:'Airtime · Data · Bills', primary:'#ffd23f', accent:'#7ee8a2', ink:'#1b1b3a',
          supportEmail:'support@jadanpay.app', supportPhone:'', currency:'₦', footer:'Developed by Jadan Tech Solutions Nig Ltd', logo:''};
}
function defaultIntegrations(){
  return {
    vtu:{enabled:false, provider:'vtpass', baseUrl:'https://sandbox.vtpass.com/api', accountId:'', env:'sandbox', lastTest:''},
    pay:{enabled:false, provider:'paystack', publicKey:'', callbackUrl:'', env:'test', lastTest:''},
    smtp:{enabled:false, provider:'smtp', host:'', port:'587', username:'', security:'STARTTLS', fromName:'JadanPay', fromEmail:'no-reply@jadanpay.app', lastTest:''}
  };
}
/* ---------- Plans and bills catalog ----------
   Each product type has its own fields, as a VTU business needs them:
   data bundles (plan code, size, validity, bundle type, reseller price),
   cable TV (package code, duration, smartcard validation),
   electricity (DisCo, meter type, min and max amount, service fee, meter validation),
   internet (plan code, size, validity) and other bills (PINs, tokens, wallet top-ups with limits).
   Plan codes, service IDs and prices come from your vendor. Sample rows are switched off until complete. */
const CAT_GROUPS = [['data','Data'],['tv','Cable TV'],['power','Electricity'],['internet','Internet'],['other','Other bills']];
const CAT_FORM = {
  data:['vendor','network','serviceId','planId','name','size','validity','bundle','cost','price','resellerPrice'],
  tv:['vendor','network','serviceId','planId','name','validity','cost','price','resellerPrice','validation'],
  power:['vendor','network','serviceId','planId','name','meter','minAmt','maxAmt','feePct','validation'],
  internet:['vendor','network','serviceId','planId','name','size','validity','cost','price','resellerPrice'],
  other:['vendor','network','serviceId','planId','name','unit','minAmt','maxAmt','cost','price']
};
const CAT_LABEL = {vendor:'Vendor (primary)', network:'Provider', serviceId:'Vendor service ID', planId:'Plan or product code',
  name:'Plan or product name', size:'Data size', validity:'Validity', bundle:'Bundle type', cost:'Vendor cost (₦)',
  price:'Customer price (₦)', resellerPrice:'Reseller price (₦)', meter:'Meter type', minAmt:'Minimum amount (₦)',
  maxAmt:'Maximum amount (₦)', feePct:'Service fee (%)', validation:'Validate before buying', unit:'Unit'};
const CAT_OPTS = {vendor:['','VTpass','Peyflex','Clubkonnect','Custom API'], bundle:['','SME','Gifting','Corporate','Normal'],
  meter:['Prepaid','Postpaid'], validation:['Required','Off'], unit:['','PIN','Token','Top-up','Other']};
const CAT_MONEY = ['cost','price','resellerPrice','minAmt','maxAmt'];
function normItem(it){
  const base = {id:'', group:'data', vendor:'', network:'', serviceId:'', planId:'', name:'', size:'', validity:'', bundle:'',
    cost:0, price:0, resellerPrice:0, meter:'', minAmt:0, maxAmt:0, feePct:0, validation:'Off', unit:'', active:false, note:'', updated:''};
  const o = Object.assign({}, base, it);
  o.serviceId = it.serviceId || it.service || '';
  delete o.service;
  ['cost','price','resellerPrice','minAmt','maxAmt','feePct'].forEach(k => o[k] = +o[k] || 0);
  if (!o.id) o.id = 'C' + Date.now() + Math.floor(Math.random() * 100000);
  return o;
}
function defaultCatalog(){
  const items = [];
  const add = o => items.push(normItem(Object.assign({id:'C' + (items.length + 1)}, o)));
  const data = [['500MB','7 days',176,200],['1.5GB','30 days',462,500],['3GB','30 days',935,1000],['10GB','30 days',2860,3000]];
  [['MTN','mtn-data'],['Airtel','airtel-data'],['Glo','glo-data'],['9mobile','etisalat-data']].forEach(([net, svc]) =>
    data.forEach(([sz, val, c, p]) => add({group:'data', network:net, serviceId:svc, name:sz + ' · ' + val, size:sz, validity:val,
      bundle:'SME', cost:c, price:p, resellerPrice:Math.round(p * 0.97), note:'Sample price. Enter the plan code from your vendor.'})));
  [['DSTV','dstv',['Padi','Yanga','Confam','Compact','Compact Plus','Premium']],
   ['GOTV','gotv',['Smallie','Jinja','Jolli','Max']],
   ['Startimes','startimes',['Nova','Basic','Smart','Classic']]].forEach(([net, svc, pk]) =>
    pk.forEach(p => add({group:'tv', network:net, serviceId:svc, name:p, validity:'1 month', validation:'Required',
      note:'Enter the package code and prices from your vendor.'})));
  [['Ikeja Electric','ikeja-electric'],['Eko DisCo','eko-electric'],['Abuja DisCo','abuja-electric']].forEach(([net, svc]) =>
    add({group:'power', network:net, serviceId:svc, name:'Prepaid electricity', meter:'Prepaid', minAmt:1000, maxAmt:100000, feePct:0,
      validation:'Required', note:'Set your limits and service fee. Meter validation runs before payment.'}));
  [['Spectranet','spectranet','10GB monthly'],['Smile','smile-direct','20GB monthly']].forEach(([net, svc, p]) =>
    add({group:'internet', network:net, serviceId:svc, name:p, size:p.split(' ')[0], validity:'1 month', note:'Enter the plan code and prices.'}));

/* ---------- UI helpers ---------- */
function toast(msg, type='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + (type==='err' ? 'err' : '');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('on'), 2800);
}
function openDrawer(html){ $('#drawerBody').innerHTML = html; $('#drawer').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
function openForm(title, fields, submitLabel, onSubmit, note){
  $('#modalBody').innerHTML = `<h2>${esc(title)}</h2>${note ? `<p class="muted">${esc(note)}</p>` : ''}` +
    fields.map(f => `<label class="fld"><span>${esc(f.label)}</span><input id="f_${f.id}" type="${f.type||'text'}" placeholder="${esc(f.ph||'')}"></label>`).join('') +
    `<div class="row end" style="margin-top:14px"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" id="fSubmit">${esc(submitLabel)}</button></div>`;
  $('#modal').classList.add('on');
  $('#fSubmit').onclick = () => {
    const vals = {}; fields.forEach(f => vals[f.id] = $('#f_' + f.id).value.trim());
    const err = onSubmit(vals);
    if (err) toast(err, 'err'); else closeModal();
  };
}
function csv(name, rows){
  if (!rows.length) return toast('Nothing to export', 'err');
  const cols = Object.keys(rows[0]);
  const body = [cols.join(','), ...rows.map(r => cols.map(c => `"${String(r[c] ?? '').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], {type:'text/csv'}));
  a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  log('export', name); toast(name + '.csv downloaded');
}
const kpi = (l, v, s) => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`;
const txLine = t => `<div class="line"><b>${label(t.type)}</b><span>${ngn(t.amt)}</span><span class="muted">${esc(t.user)}</span>${badge(t.status)}<span class="muted" style="margin-left:auto">${when(t.at)}</span></div>`;

function filteredUsers(){
  const q = UI.uq.toLowerCase();
  return DB.users.filter(u => {
    const okF = {all:true, active:u.status==='active', suspended:u.status==='suspended', reseller:u.tier==='Reseller', nopin:!u.pinSet}[UI.uf];
    const okQ = !q || [u.name,u.email,u.phone].some(x => String(x).toLowerCase().includes(q));
    return okF && okQ;
  });

function filteredTx(){
  const q = UI.tq.toLowerCase();
  return DB.txs.filter(t => (UI.tt==='all' || t.type===UI.tt) && (UI.ts==='all' || t.status===UI.ts) &&
    (!q || [t.ref,t.user,t.phone].some(x => String(x).toLowerCase().includes(q))));
}

async function doLogin(){
  const e = $('#lgEmail').value.trim().toLowerCase(), p = $('#lgPass').value;
  const st = DB.staff.find(x => x.email === e);
  const ok = st && (st.hash ? (await hashP(p, st.salt)) === st.hash : st && st.pass === p);
  if (!ok) { $('#lgErr').textContent = 'Wrong email or password.'; return; }
  if (st.status !== 'active') { $('#lgErr').textContent = 'This account is suspended. Ask the owner to reactivate it.'; return; }
  CUR = st.id; AUTH = true; st.lastLogin = new Date().toISOString(); save(); log('login', st.email);
  VIEW = canView(VIEW) ? VIEW : (VIEWS.find(v => canView(v[0])) || ['profile'])[0];
  if (st.mustChange) { VIEW = 'profile'; toast('Please change your temporary password'); }
  render();
}

function act(name, el){
  const need = ACT_PERM[name];
  if (need && !can(need)) return toast('Your role does not allow this action', 'err');
  const id = el.dataset.id, i = +el.dataset.i, v = el.dataset.v;
  switch(name){
    case 'login': return doLogin();
    case 'logout': AUTH = false; CUR = null; return render();
    case 'navToggle': NAV_COLLAPSED = !NAV_COLLAPSED; try { localStorage.setItem('jp_admin_nav', NAV_COLLAPSED ? '1' : '0'); } catch(e) {} return render();
    case 'staffAdd': return openStaffForm(null);
    case 'staffEdit': return openStaffForm(DB.staff.find(x => x.id === id));
    case 'staffToggle': return toggleStaff(id);
    case 'staffReset': return resetStaff(id);
    case 'staffDel': return deleteStaff(id);
    case 'roleAdd': return openRoleForm(null);
    case 'roleEdit': return openRoleForm(DB.roles.find(x => x.id === id));
    case 'roleDel': return deleteRole(id);
    case 'profSave': return saveProfile();
    case 'profPass': return changeOwnPassword();
    case 'closeDrawer': return closeDrawer();
    case 'closeModal': return closeModal();
    case 'openUser': return openUser(id);
    case 'openTx': return openTx(id);
    case 'setUF': UI.uf = v; return render();
    case 'setTT': UI.tt = v; return render();
    case 'setTS': UI.ts = v; return render();
    case 'selTicket': UI.ticket = id; return render();

    case 'uSuspend': { const u = U(id); u.status = u.status==='active' ? 'suspended' : 'active'; save(); log('customer.status', `${u.name} → ${u.status}`); toast(`${u.name} is now ${u.status}`); openUser(id); return render(); }
    case 'uTier': { const u = U(id); u.tier = u.tier==='Reseller' ? 'Basic' : 'Reseller'; save(); log('customer.tier', `${u.name} → ${u.tier}`); toast(`${u.name} is now ${u.tier}`); openUser(id); return render(); }
    case 'uWallet': {
      const u = U(id);
      openForm(`${v==='credit' ? 'Credit' : 'Debit'} wallet · ${u.name}`, [{id:'amt', label:'Amount (₦)', type:'number', ph:'e.g. 1000'}, {id:'why', label:'Reason (required, for the audit log)'}], 'Confirm', vals => {
        const amt = +vals.amt;
        if (!(amt > 0)) return 'Enter a valid amount.';
        if (!vals.why) return 'A reason is required.';
        if (v==='debit' && amt > u.wallet) return 'That is more than the wallet balance.';
        u.wallet += v==='credit' ? amt : -amt;
        save(); log('customer.wallet', `${v} ${ngn(amt)} for ${u.name}: ${vals.why}`);
        toast(`${v==='credit' ? 'Credited' : 'Debited'} ${ngn(amt)}`); openUser(id); render();
      });
      return;
    }
    case 'uResetPin': {
      const u = U(id);
      openForm('Reset transaction PIN · ' + u.name, [{id:'why', label:'Reason (required)', ph:'e.g. identity confirmed by phone'}], 'Reset PIN', vals => {
        if (!vals.why) return 'A reason is required.';
        u.pinSet = false; save(); log('customer.pinReset', `${u.name}: ${vals.why}`);
        toast('PIN cleared. The customer creates a new one next time.'); openUser(id); render();
      }, 'The customer must create a new PIN before their next transaction.');
      return;
    }
    case 'uNotify': {
      const u = U(id);
      openForm('Send alert to ' + u.name, [{id:'msg', label:'Message'}], 'Send alert', vals => {
        if (!vals.msg) return 'Write a message first.';
        u.alerts.unshift({text:vals.msg, at:new Date().toISOString()}); save(); log('customer.alert', `${u.name}: ${vals.msg}`);
        toast('Alert sent to ' + u.name); openUser(id); render();
      });
      return;
    }
    case 'txRefund': {
      const t = DB.txs.find(x => x.ref === id);
      if (t.status !== 'success') return toast('Only successful transactions can be refunded', 'err');
      openForm('Refund ' + t.ref, [{id:'why', label:'Reason (required)'}], 'Refund to wallet', vals => {
        if (!vals.why) return 'A reason is required.';
        const u = U(t.userId); u.wallet += t.amt; t.status = 'refunded';
        save(); log('transaction.refund', `${t.ref} ${ngn(t.amt)} to ${u.name}: ${vals.why}`);
        toast('Refunded to wallet'); openTx(t.ref); render();
      });
      return;
    }

    case 'exportUsers': return csv('customers', DB.users.map(u => ({id:u.id, name:u.name, email:u.email, phone:u.phone, tier:u.tier, wallet:u.wallet, earnings:u.earn, status:u.status, joined:u.joined})));
    case 'exportTxs': return csv('transactions', filteredTx().map(t => ({ref:t.ref, type:label(t.type), customer:t.user, phone:t.phone, network:t.network, amount:t.amt, profit:t.pr, status:t.status, at:t.at})));
    case 'exportTickets': return csv('support-tickets', DB.tickets.map(t => ({id:t.id, customer:t.user, subject:t.subject, status:t.status, messages:t.msgs.length})));
    case 'exportAudit': return csv('audit-log', DB.audit.map(a => ({at:a.at, by:a.by, action:a.action, detail:a.detail})));

    case 'togglePlan': { const p = DB.plans[i]; p.active = !p.active; save(); log('service.plan', `${p.sz} ${p.active?'on':'off'}`); return render(); }
    case 'toggleProv': { const p = DB.providers[i]; p.active = !p.active; save(); log('service.provider', `${p.name} ${p.active?'enabled':'disabled'}`); toast(`${p.name} ${p.active?'enabled':'disabled'}`); return render(); }
    case 'toggleSetting': { const k = el.dataset.k; DB.settings[k] = !DB.settings[k]; save(); log('setting', `${k} → ${DB.settings[k]}`); toast('Saved'); return render(); }

    case 'annSave': {
      const title = $('#aTitle').value.trim(), body = $('#aBody').value.trim();
      if (!title || !body) return toast('Add a title and a message', 'err');
      const status = $('#aStatus').value;
      DB.announcements.unshift({id:'A'+Date.now(), title, body, audience:$('#aAud').value, status, at:new Date().toISOString()});
      save(); log('announcement.create', `${title} (${status})`);
      toast(status==='published' ? 'Announcement published' : 'Saved as draft'); return render();
    }
    case 'annToggle': { const a = DB.announcements.find(x => x.id === id); a.status = a.status==='published' ? 'draft' : 'published'; save(); log('announcement.toggle', `${a.title} → ${a.status}`); return render(); }
    case 'annDel': { DB.announcements = DB.announcements.filter(x => x.id !== id); save(); log('announcement.delete', id); return render(); }

    case 'quick': { const r = $('#replyTxt'); if (r) r.value = el.dataset.text; return; }
    case 'reply': {
      const tk = DB.tickets.find(x => x.id === UI.ticket), txt = $('#replyTxt').value.trim();
      if (!txt) return toast('Write a reply first', 'err');
      tk.msgs.push({from:'agent', text:txt, at:new Date().toISOString()}); save(); log('support.reply', tk.id);
      toast('Reply sent'); return render();
    }
    case 'resolve': { const tk = DB.tickets.find(x => x.id === id); tk.status = tk.status==='open' ? 'resolved' : 'open'; save(); log('support.status', `${tk.id} → ${tk.status}`); return render(); }

    case 'toggleInteg': { const kind = el.dataset.kind; DB.integrations[kind].enabled = !DB.integrations[kind].enabled; save(); log('integration.toggle', kind + ' ' + (DB.integrations[kind].enabled ? 'on' : 'off')); return render(); }
    case 'saveInteg': return saveInteg(el.dataset.kind);
    case 'testInteg': return testInteg(el.dataset.kind);
    case 'pickLogo': return $('#brandLogo').click();
    case 'removeLogo': { DB.brand.logo = ''; save(); log('brand.logo', 'removed'); return render(); }
    case 'exportBrand': {
      const cfg = {brand: DB.brand, integrations: Object.fromEntries(Object.keys(DB.integrations).map(k => [k, pickPlain(DB.integrations[k])]))};
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'}));
      a.download = 'jadanpay-brand-config.json'; document.body.appendChild(a); a.click(); a.remove();
      return toast('Brand config downloaded (no secret keys included)');
    }
    case 'setCat': UI.cat = v; return render();
    case 'catAdd': return openCatForm(null);
    case 'catEdit': return openCatForm(DB.catalog.find(x => x.id === id));
    case 'catToggle': {
      const it = DB.catalog.find(x => x.id === id);
      if (!it.active && !catReady(it)) return toast('Complete this item first: ' + catStatus(it).replace(/<[^>]+>/g, '').toLowerCase(), 'err');
      it.active = !it.active; save(); log('catalog.toggle', `${it.network} ${it.name} ${it.active ? 'live' : 'off'}`); return render();
    }
    case 'catDel': {
      const it = DB.catalog.find(x => x.id === id);
      openForm('Delete item', [{id:'c', label:'Type DELETE to confirm'}], 'Delete', vals => {
        if (vals.c !== 'DELETE') return 'Type DELETE exactly.';
        DB.catalog = DB.catalog.filter(x => x.id !== id); save(); log('catalog.delete', `${it.network} ${it.name}`);
        toast('Item deleted'); render();
      });
      return;
    }
    case 'catImport': return openImport();
    case 'catImportRun': return runImport();
    case 'catExport': return csv('catalog', DB.catalog.map(catRow));
    case 'catTemplate': return csv('catalog-template', ['data','tv','power','internet','other'].map(g => catRow(normItem({group:g}))));
    case 'backup': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'}));
      a.download = 'jadanpay-admin-backup.json'; document.body.appendChild(a); a.click(); a.remove();
      log('data.backup', 'downloaded'); return toast('Backup downloaded');
    }
    case 'restore': return $('#restoreFile').click();
    case 'resetData': {
      openForm('Reset all data', [{id:'c', label:'Type RESET to confirm'}], 'Reset everything', vals => {
        if (vals.c !== 'RESET') return 'Type RESET exactly.';
        DB = seed(); save(); log('data.reset', 'all sample data'); toast('Data reset'); render();
      }, 'This clears every change made in this dashboard.');
      return;
    }
  }
}

function viewOverview(){
  const today = dayKey(TODAY);
  const tday = DB.txs.filter(t => dayKey(t.at) === today);
  const ok = DB.txs.filter(t => t.status === 'success');
  const vol = ok.reduce((s,t) => s + t.amt, 0), profit = ok.reduce((s,t) => s + t.pr, 0);
  const float = DB.users.reduce((s,u) => s + u.wallet, 0);
  const open = DB.tickets.filter(t => t.status === 'open').length;
  const rate = DB.txs.length ? (ok.length / DB.txs.length * 100).toFixed(1) : '0';
  const days = [...Array(7)].map((_,i) => {
    const d = new Date(TODAY.getTime() - (6 - i) * 864e5), k = dayKey(d);
    return {label:d.toLocaleDateString('en-NG',{weekday:'short'}), v: ok.filter(t => dayKey(t.at) === k).reduce((s,t) => s + t.amt, 0)};
  });
  const max = Math.max(1, ...days.map(d => d.v));
  const mix = ['air','data','bill','send','fund'].map(k => ({k, c: DB.txs.filter(t => t.type === k).length}));
  const mixMax = Math.max(1, ...mix.map(m => m.c));
  const todayOk = tday.filter(t => t.status==='success').reduce((s,t) => s + t.amt, 0);
  return `
  <div class="grid k4">
    ${kpi('Customers', DB.users.length, DB.users.filter(u => u.status==='active').length + ' active')}
    ${kpi('Today', tday.length + ' transactions', ngn(todayOk) + ' volume')}
    ${kpi('Profit (all time)', ngn(profit), 'from sales and margins')}
    ${kpi('Wallet float', ngn(float), 'held for customers')}
  </div>
  <div class="grid k4" style="margin-top:14px">
    ${kpi('Success rate', rate + '%', (DB.txs.length - ok.length) + ' failed or refunded')}
    ${kpi('Open tickets', open, 'support inbox')}
    ${kpi('Volume (all time)', ngn(vol), 'successful payments')}
    ${kpi('App status', DB.settings.maintenance ? 'Maintenance' : 'Live', DB.settings.maintenance ? 'Customers see a notice' : 'Running normally')}
  </div>
  <div class="grid k2" style="margin-top:14px">
    <div class="card"><h2>Volume, last 7 days</h2>
      <div class="bars">${days.map(d => `<div style="height:${Math.max(4, d.v / max * 100)}%"><span>${d.label}</span></div>`).join('')}</div></div>
    <div class="card"><h2>Service mix</h2>
      ${mix.map(m => `<div class="row" style="margin:12px 0"><span style="width:90px">${label(m.k)}</span><div style="flex:1;background:#eef0fb;border-radius:8px;height:12px"><div style="width:${m.c/mixMax*100}%;height:12px;background:var(--acc);border-radius:8px"></div></div><b>${m.c}</b></div>`).join('')}</div>
  </div>
  <div class="grid k2" style="margin-top:14px">
    <div class="card"><h2>Recent transactions</h2>${DB.txs.slice(0,6).map(txLine).join('')}</div>
    <div class="card"><h2>Admin activity</h2>${DB.audit.slice(0,6).map(a => `<div class="line"><b>${esc(a.action)}</b><span class="muted">${esc(a.detail)}</span><span class="muted" style="margin-left:auto">${when(a.at)}</span></div>`).join('') || '<p class="muted">No activity yet.</p>'}</div>
  </div>`;
}

/* ---------- Integration actions (secrets go to the backend only) ---------- */
function pickPlain(c){
  const out = {};
  Object.keys(c).forEach(k => { if (!k.startsWith('has_') && k !== 'lastTest') out[k] = c[k]; });
  return out;
}
function saveInteg(kind){
  const c = DB.integrations[kind];
  const secrets = {};
  INTEG_SECRETS[kind].forEach(k => { const el = $('#sec_' + kind + '_' + k); if (el && el.value) secrets[k] = el.value; });
  const hasSecret = Object.keys(secrets).length > 0;
  const base = DB.settings.apiBase;
  if (!base) {
    save(); log('integration.save', kind + ' (settings only)');
    if (hasSecret) { INTEG_SECRETS[kind].forEach(k => { const el = $('#sec_' + kind + '_' + k); if (el) el.value = ''; });
      toast('Settings saved. Secret keys were not stored: connect a backend first.', 'err'); }
    else toast('Settings saved in this browser');
    return render();
  }
  fetch(base + '/admin/integrations/' + kind, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({config: pickPlain(c), secrets})
  })
  .then(r => { if (!r.ok) throw new Error('server responded ' + r.status); return r; })
  .then(() => {
    INTEG_SECRETS[kind].forEach(k => { if (secrets[k]) c['has_' + k] = true; });
    save(); log('integration.save', kind + (hasSecret ? ' (keys updated on server)' : ' (settings)'));
    toast('Saved to your backend'); render();
  })
  .catch(err => toast('Could not save: ' + err.message, 'err'));
}
function testInteg(kind){
  const c = DB.integrations[kind], base = DB.settings.apiBase;
  if (!base) { toast('Connect a backend first (Settings → Backend connection)', 'err'); return; }
  fetch(base + '/admin/integrations/' + kind + '/test', {method:'POST'})
  .then(r => r.json())
  .then(d => {
    c.lastTest = (d.ok ? 'passed' : 'failed') + ' · ' + when(new Date().toISOString()) + (d.message ? ' · ' + d.message : '');
    save(); log('integration.test', kind + ' ' + (d.ok ? 'passed' : 'failed'));
    toast(d.ok ? 'Connection works' : 'Test failed: ' + (d.message || 'check the keys'), d.ok ? 'ok' : 'err'); render();
  })
  .catch(err => { c.lastTest = 'failed · ' + when(new Date().toISOString()); save(); toast('Test failed: ' + err.message, 'err'); render(); });
}


/* ---------- Plans and bills catalog ---------- */
const IMPORT_MAP = {group:'group', vendor:'vendor', network:'network', service_id:'serviceId', plan_id:'planId', name:'name', size:'size',
  validity:'validity', bundle:'bundle', cost:'cost', price:'price', reseller_price:'resellerPrice', meter:'meter',
  min_amount:'minAmt', max_amount:'maxAmt', fee_percent:'feePct', validation:'validation', unit:'unit'};
function catReady(it){
  if (!it.vendor || !it.network || !it.name) return false;
  if (it.group === 'power') return !!it.planId && it.minAmt > 0 && it.maxAmt >= it.minAmt;
  if (it.planId === 'variable') return it.minAmt > 0 && it.maxAmt >= it.minAmt;
  return !!it.planId && it.price > 0;
}
function catStatus(it){
  if (it.active) return '<span class="tag t-ok">Live</span>';
  if (!it.vendor) return '<span class="tag t-warn">Needs vendor</span>';
  if (!it.planId) return '<span class="tag t-warn">Needs plan code</span>';
  if (it.group === 'power' || it.planId === 'variable') {
    if (!(it.minAmt > 0 && it.maxAmt >= it.minAmt)) return '<span class="tag t-warn">Needs limits</span>';
  } else if (!(it.price > 0)) return '<span class="tag t-warn">Needs price</span>';
  if (!catReady(it)) return '<span class="tag t-warn">Incomplete</span>';
  return '<span class="tag t-info">Off</span>';
}
function catRow(it){
  return {group:it.group, vendor:it.vendor, network:it.network, service_id:it.serviceId, plan_id:it.planId, name:it.name,
    size:it.size, validity:it.validity, bundle:it.bundle, cost:it.cost, price:it.price, reseller_price:it.resellerPrice,
    meter:it.meter, min_amount:it.minAmt, max_amount:it.maxAmt, fee_percent:it.feePct, validation:it.validation,

    <p class="muted">First row = column names. Columns: group, vendor, network, service_id, plan_id, name, size, validity, bundle, cost, price, reseller_price, meter, min_amount, max_amount, fee_percent, validation, unit. Use the Template button for the exact headers. Imported items start switched off.</p>

    <textarea id="impTxt" rows="8" placeholder="Or paste CSV rows here"></textarea>
    <div class="row end" style="margin-top:12px"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="catImportRun">Import</button></div>`;

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  const head = lines.shift().split(',').map(h => h.trim().toLowerCase());
  return lines.map(l => { const cells = l.split(',').map(c => c.trim().replace(/^"|"$/g, '')); const o = {}; head.forEach((h,i) => o[h] = cells[i] ?? ''); return o; });
}
function runImport(){
  const rows = parseCSV($('#impTxt').value);
  if (!rows.length) return toast('Paste or choose a CSV first', 'err');
  let added = 0, updated = 0, skipped = 0;
  rows.forEach(r => {
    const obj = {};
    Object.keys(IMPORT_MAP).forEach(h => { if (r[h] !== undefined && r[h] !== '') obj[IMPORT_MAP[h]] = r[h]; });
    const group = (obj.group || 'data').toLowerCase();
    if (!CAT_FORM[group] || !obj.network || !obj.name) { skipped++; return; }
    delete obj.group; obj.group = group;
    const existing = DB.catalog.find(x => x.group === group && x.network === obj.network && (obj.planId ? x.planId === obj.planId : x.name === obj.name));
    const item = normItem(Object.assign({}, existing || {}, obj, {id: existing ? existing.id : undefined, updated: new Date().toISOString()}));
    item.active = existing ? existing.active && catReady(item) : false;
    if (existing) { Object.assign(existing, item); updated++; } else { DB.catalog.push(item); added++; }
  });
  save(); log('catalog.import', `${added} added, ${updated} updated, ${skipped} skipped`);
  closeModal(); toast(`Imported: ${added} added, ${updated} updated${skipped ? ', ' + skipped + ' skipped' : ''}`); render();
}

function newSalt(){ const b = new Uint8Array(16); crypto.getRandomValues(b); return Array.from(b, x => x.toString(16).padStart(2,'0')).join(''); }
async function hashP(p, salt){
  const data = new TextEncoder().encode(salt + ':' + p);
  if (crypto.subtle) { const buf = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(buf), x => x.toString(16).padStart(2,'0')).join(''); }
  let h = 0; for (const c of data) h = (h * 31 + c) >>> 0; return 'x' + h.toString(16);
}
async function checkPass(st, p){

}
async function ensureStaffHashes(){

}

    else { DB.roles.push({id:'R' + Date.now(), name, desc, perms, system:false}); log('role.create', name); }
    save(); closeModal(); toast('Role saved'); render();
  };
}
function deleteRole(id){
  const r = DB.roles.find(x => x.id === id); if (!r) return;
  if (r.system) return toast('Built-in roles cannot be deleted', 'err');
  if (DB.staff.some(s => s.roleId === id)) return toast('Move the staff in this role to another role first', 'err');
  DB.roles = DB.roles.filter(x => x.id !== id); save(); log('role.delete', r.name); toast('Role deleted'); render();
}

/* My profile (every signed-in person) */
function viewProfile(){
  const st = self(), r = roleOf(st) || {};
  return `<div class="grid k2">
    <div class="card"><h2>My profile</h2>
      <div class="row" style="margin-bottom:14px;gap:14px"><div class="avatar-big">${esc(initials(st.name))}</div>
        <div><b style="font-size:16px">${esc(st.name)}</b><div class="muted">${esc(r.name || 'No role')}</div></div></div>
      <label class="fld"><span>Full name</span><input id="pf_name" value="${esc(st.name)}"></label>
      <label class="fld"><span>Phone</span><input id="pf_phone" value="${esc(st.phone || '')}"></label>
      <label class="fld"><span>Email (used to sign in)</span><input id="pf_email" type="email" value="${esc(st.email)}"></label>
      <label class="fld"><span>Current password (needed only to change your email)</span><input id="pf_cur" type="password" autocomplete="current-password"></label>
      <button class="btn" data-act="profSave">Save profile</button>
    </div>
    <div class="card"><h2>Change password</h2>
      ${st.mustChange ? '<div class="notice" style="margin-bottom:12px">Your password was set by the owner. Please change it now.</div>' : ''}
      <label class="fld"><span>Current password</span><input id="pw_cur" type="password" autocomplete="current-password"></label>
      <label class="fld"><span>New password (8+ characters, with a letter and a number)</span><input id="pw_new" type="password" autocomplete="new-password"></label>
      <label class="fld"><span>Confirm new password</span><input id="pw_new2" type="password" autocomplete="new-password"></label>
      <button class="btn" data-act="profPass">Update password</button>
      <h2 style="margin-top:18px">Access</h2>
      <p class="muted" style="font-size:13px">Your role: <b>${esc(r.name || 'none')}</b>. ${r.perms === '*' ? 'Full access.' : (Array.isArray(r.perms) ? r.perms.length + ' permissions.' : '')}
        Last sign-in: ${st.lastLogin ? when(st.lastLogin) : 'this session'}.</p>
    </div></div>`;
}
async function saveProfile(){
  const st = self();
  const name = $('#pf_name').value.trim(), phone = $('#pf_phone').value.trim(), email = $('#pf_email').value.trim().toLowerCase();
  if (!name) return toast('Name is required', 'err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter a valid email', 'err');
  if (email !== st.email) {
    if (DB.staff.some(x => x.id !== st.id && x.email === email)) return toast('That email is already used', 'err');
    if (!(await checkPass(st, $('#pf_cur').value))) return toast('Enter your current password to change your email', 'err');
    st.email = email;
  }
  st.name = name; st.phone = phone; save(); log('profile.update', st.email);
  toast('Profile saved'); render();
}
async function changeOwnPassword(){
  const st = self();
  const cur = $('#pw_cur').value, nw = $('#pw_new').value, nw2 = $('#pw_new2').value;
  if (!(await checkPass(st, cur))) return toast('Current password is wrong', 'err');
  if (!strongPass(nw)) return toast('New password needs 8+ characters with a letter and a number', 'err');
  if (nw !== nw2) return toast('The new passwords do not match', 'err');
  st.salt = newSalt(); st.hash = await hashP(nw, st.salt); delete st.pass; st.mustChange = false;
  save(); log('profile.password', st.email); toast('Password updated'); render();
}

/* ---------- Render and events ---------- */
const VIEW_FN = {overview:viewOverview, users:viewUsers, txs:viewTxs, services:viewServices, network:viewNetwork,
  support:viewSupport, announce:viewAnnounce, referrals:viewReferrals, reports:viewReports, audit:viewAudit, settings:viewSettings, integrations:viewIntegrations, brand:viewBrand, catalog:viewCatalog, staff:viewStaff, roles:viewRoles, profile:viewProfile};
function renderNav(){
  const groups = NAV_GROUPS.map(([g, keys]) => {
    const ok = keys.filter(k => canView(k));
    if (!ok.length) return '';
    return `<div class="grp">${g}</div>` + ok.map(k => {
      const v = VIEWS.find(x => x[0] === k);
      return `<button class="nav ${VIEW===k?'on':''}" data-view="${k}" title="${v[1]}"><span class="ic">${v[2]}</span><span class="lbl">${v[1]}</span></button>`;
    }).join('');
  }).join('');
  $('#nav').innerHTML = groups + `<button class="nav" data-act="logout" style="margin-top:12px"><span class="ic">⏻</span><span class="lbl">Log out</span></button>`;
}
function render(){
  $('#shell').classList.toggle('collapsed', NAV_COLLAPSED);
  const me = self();
  if (!AUTH || !me) { AUTH = false; $('#login').hidden = false; $('#shell').hidden = true; return; }
  $('#login').hidden = true; $('#shell').hidden = false;
  if (!canView(VIEW)) VIEW = (VIEWS.find(v => canView(v[0])) || ['profile'])[0];
  renderNav();
  $('#vTitle').textContent = VIEWS.find(v => v[0] === VIEW)[1];
  $('#view').innerHTML = VIEW_FN[VIEW]();
  $('#maintBadge').textContent = DB.settings.maintenance ? 'Maintenance on' : 'Live';
  $('#maintBadge').className = 'tag ' + (DB.settings.maintenance ? 't-warn' : 't-ok');
  $('#whoami').textContent = me.name + ' · ' + ((roleOf(me) || {}).name || 'No role');
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { act(a.dataset.act, a); return; }
  const n = e.target.closest('[data-view]');
  if (n) { VIEW = n.dataset.view; closeDrawer(); render(); }
});

document.addEventListener('change', e => {
  const el = e.target;
  const NEED_EDIT = {plan:'pricing.edit', setting:'settings.edit', net:'network.edit', brand:'brand.edit', integ:'integrations.edit'};
  if (el.dataset && el.dataset.field && NEED_EDIT[el.dataset.field] && !can(NEED_EDIT[el.dataset.field])) { toast('Your role cannot change this', 'err'); return render(); }
  if (el.id === 'impFile') {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('#impTxt').value = r.result; }; r.readAsText(f); return;
  }
  if (el.id === 'brandLogo') {
    if (!can('brand.edit')) { toast('Your role cannot change the logo', 'err'); return render(); }
    const f = el.files[0]; if (!f) return;
    if (f.size > 300 * 1024) return toast('Logo must be under 300 KB', 'err');
    const r = new FileReader();
    r.onload = () => { DB.brand.logo = r.result; save(); log('brand.logo', 'uploaded'); toast('Logo updated'); render(); };
    r.readAsDataURL(f); return;
  }
  if (el.id === 'restoreFile') {
    if (!can('settings.edit')) { toast('Your role cannot restore backups', 'err'); return render(); }
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.users || !d.txs) throw new Error('bad backup');
        DB = d; save(); log('data.restore', f.name); toast('Backup restored'); render();
      } catch (err) { toast('That file is not a valid backup', 'err'); }
    };
    r.readAsText(f); return;
  }
  const f = el.dataset.field; if (!f) return;
  const i = +el.dataset.i, k = el.dataset.k, val = el.value;
  if (f === 'brand') { DB.brand[k] = val; save(); log('brand', k + ' changed'); toast('Brand saved'); return render(); }
  if (f === 'integ') { const kind = el.dataset.kind; DB.integrations[kind][k] = val; save(); log('integration.settings', kind + '.' + k + ' changed'); return render(); }
  if (f === 'uq') { UI.uq = val; return render(); }
  if (f === 'tq') { UI.tq = val; return render(); }
  if (f === 'plan') {
    const p = DB.plans[i], n = +val;
    if (!(n > 0)) { toast('Enter a valid amount', 'err'); return render(); }
    p[k] = n; save(); log('service.plan', `${p.sz} ${k} → ${n}`);
    if (p.cost > p.price) toast('Cost is higher than the price. Check the numbers.', 'err'); else toast('Saved');
    return render();
  }
  if (f === 'setting') {
    const n = (k === 'banner' || k === 'apiBase') ? val : +val;
    DB.settings[k] = n; save(); log('setting', `${k} → ${n}`); toast('Saved'); return render();
  }
  if (f === 'net') {
    const n = DB.networks[i]; n[k] = k === 'status' ? val : +val;
    save(); log('network', `${n.name} ${k} → ${n[k]}`); toast('Saved'); return render();
  }
});

document.addEventListener('keydown', e => {
  if (!AUTH && e.key === 'Enter' && (e.target.id === 'lgEmail' || e.target.id === 'lgPass')) act('login', e.target);
});

render();
ensureStaffHashes().then(() => render());
</script>
